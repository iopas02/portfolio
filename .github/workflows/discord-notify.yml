name: Discord Deploy Notification

on:
  push:
    branches:
      - master  # change this if your default branch is "master" or something else

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel Deployment
        id: wait
        run: |
          echo "Waiting 30 seconds for Vercel to deploy..."
          sleep 30

      - name: Get Vercel Deployment URL
        id: vercelUrl
        run: |
          URL=""
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            URL=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=1&target=production&state=READY" \
              | jq -r '.deployments[0].url // empty')
            if [ -n "$URL" ]; then
              URL="https://$URL"
            fi
          fi
          if [ -z "$URL" ] && [ -n "${{ secrets.VERCEL_PROD_URL }}" ]; then
            URL="${{ secrets.VERCEL_PROD_URL }}"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"


      - name: Send Discord Notification (Success)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "✅ Deployment Successful",
              "description": "A new push was deployed to Vercel successfully.",
              "url": "${{ steps.vercelUrl.outputs.url }}",
              "color": 3066993,
              "fields": [
                {
                  "name": "📁 Repository",
                  "value": "${{ github.repository }}",
                  "inline": true
                },
                {
                  "name": "🌿 Branch",
                  "value": "${{ github.ref_name }}",
                  "inline": true
                },
                {
                  "name": "🚀 Live URL",
                  "value": "${{ steps.vercelUrl.outputs.url }}",
                  "inline": false
                },
                {
                  "name": "💬 Commit",
                  "value": "${{ github.event.head_commit.message }}",
                  "inline": false
                },
                {
                  "name": "👤 Pushed by",
                  "value": "${{ github.actor }}",
                  "inline": true
                }
              ],
              "footer": {
                "text": "GitHub Actions • Vercel"
              },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord Notification (Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "❌ Deployment Failed",
              "description": "Something went wrong during the Vercel deployment.",
              "url": "${{ steps.vercelUrl.outputs.url }}",
              "color": 15158332,
              "fields": [
                {
                  "name": "📁 Repository",
                  "value": "${{ github.repository }}",
                  "inline": true
                },
                {
                  "name": "🌿 Branch",
                  "value": "${{ github.ref_name }}",
                  "inline": true
                },
                {
                  "name": "🚀 Live URL",
                  "value": "${{ steps.vercelUrl.outputs.url }}",
                  "inline": false
                },
                {
                  "name": "💬 Commit",
                  "value": "${{ github.event.head_commit.message }}",
                  "inline": false
                },
                {
                  "name": "👤 Pushed by",
                  "value": "${{ github.actor }}",
                  "inline": true
                }
              ],
              "footer": {
                "text": "GitHub Actions • Vercel"
              },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
